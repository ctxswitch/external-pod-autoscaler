replicaCount: 1

image:
  repository: ctxsh/external-pod-autoscaler
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

controller:
  command:
    - /usr/local/bin/external-pod-autoscaler
  workingDir: ""
  logLevel: info
  enableWebhooks: true
  scraperWorkers: 20
  securityContext: {}
  startupProbe:
    httpGet:
      path: /readyz
      port: metrics
    periodSeconds: 2
    failureThreshold: 60
  livenessProbe:
    httpGet:
      path: /healthz
      port: metrics
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: metrics
    periodSeconds: 5
    failureThreshold: 3

service:
  type: ClusterIP
  webhookPort: 443
  metricsPort: 9090
  webhookNodePort: null

cert-manager:
  enabled: true
  crds:
    enabled: true

resources: {}

extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
